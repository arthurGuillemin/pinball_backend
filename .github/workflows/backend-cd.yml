name: CD Production Backend

on:
  push:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  test:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test env
        run: cp .env.test .env

      - name: Run tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Setup Git auth for semantic release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'

  build-and-push:
    # Pousse l'image sur Docker Hub pour deux usages :
    # 1. linux/amd64  → Azure App Service (déployé juste après dans le job deploy)
    #                   → pratique pour les devs front qui veulent tester sans lancer le back en local
    # 2. linux/arm64  → cabinet Fliphetic qui pull l'image au reload
    #                   → les vars d'env sensibles sont injectées via le .env sur le cabinet
    #                      (pas en build-arg : le backend les lit au runtime, pas au build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: arthurguill/pinball-backend
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=arthurguill/pinball-backend:buildcache
          cache-to: type=registry,ref=arthurguill/pinball-backend:buildcache,mode=max

      - name: Wait for image propagation
        run: sleep 10

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: arthurguill/pinball-backend:latest
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  deploy-azure:
    # Déploie sur Azure App Service — utilisé par les devs front
    # pour tester sans lancer le backend en local.
    needs: [release, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: flipper-backend-app
          images: arthurguill/pinball-backend:latest

  notify-team:
    needs: [release, build-and-push, deploy-azure]
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        if: needs.deploy-azure.result == 'success'
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"**Backend : Release v${{ needs.release.outputs.new_release_version }}**\nImage Docker pushée pour amd64 + arm64\nAzure : https://flipper-backend-app.azurewebsites.net\nTriggered by @${{ github.actor }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify failure
        if: needs.build-and-push.result == 'failure' || needs.deploy-azure.result == 'failure'
        run: |
          REASON="Docker build"
          if [ "${{ needs.deploy-azure.result }}" = "failure" ]; then
            REASON="déploiement Azure"
          fi
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \" **Backend : Release v${{ needs.release.outputs.new_release_version }} — Échec**\nErreur : ${REASON}\nTriggered by @${{ github.actor }}\nLogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK }}
