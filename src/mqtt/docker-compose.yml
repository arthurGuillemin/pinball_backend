version: '3.7'
services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: MyMosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/config/pwfile:/mosquitto/config/pwfile
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
